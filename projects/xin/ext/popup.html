<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;width:280px;
       font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:#ffffff;color:#1c2230}
  .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  h1{margin:0;font-size:17px;letter-spacing:.5px}
  .ver{font-size:11px;color:#8b94a8;font-weight:600}
  label{display:block;border:1px solid #e3e8f0;border-radius:10px;padding:11px 12px;
        margin-bottom:9px;cursor:pointer;transition:.15s}
  label:hover{border-color:#b9c8e4;background:#f8faff}
  label.on{border-color:#2b6cf6;background:#f2f7ff;box-shadow:0 0 0 3px rgba(43,108,246,.1)}
  .row{display:flex;align-items:center;gap:9px}
  input{margin:0;accent-color:#2b6cf6}
  .nm{font-size:13.5px;font-weight:600}
  .ds{font-size:11.5px;color:#7a859c;margin-top:4px;margin-left:23px;line-height:1.5}
  .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;margin-left:6px;vertical-align:1px}
  .t-def{background:#eef1f6;color:#6b7489}
  .t-rec{background:#e8f8ee;color:#0b7a45}
  #stat{margin-top:12px;padding-top:11px;border-top:1px solid #eef1f6;
        font-size:11.5px;color:#7a859c;line-height:1.6}
  .hint{font-size:10.5px;color:#9aa3b5;margin-top:6px}
</style>
</head>
<body>
  <div class="hd">
    <h1>辛 / Xin</h1>
    <span class="ver">V1.2.1</span>
  </div>

  <label id="lb-soft">
    <div class="row">
      <input type="radio" name="mode" value="soft">
      <span class="nm">柔和模式</span><span class="tag t-def">保守</span>
    </div>
    <div class="ds">只拦网络层。广告加载不到，但会留下灰色空框。</div>
  </label>

  <label id="lb-force">
    <div class="row">
      <input type="radio" name="mode" value="force">
      <span class="nm">强迫模式</span><span class="tag t-rec">默认 · 推荐</span>
    </div>
    <div class="ds">网络层 + 页面层。广告框整个删除，页面满屏正常。</div>
  </label>

  <div id="stat">读取中…</div>
  <div class="hint">切换后刷新页面生效（已打开的标签需重载）</div>

<script src="popup.js"></script>
</body>
</html>
